services:
  config-server:
    build:
      context: ./config-server
    container_name: tr_config_server
    ports:
      - "8888:8888"
    volumes:
      - ./config-server/src/main/resources/configurations:/configurations
    networks:
      - tr-net
    environment:
      - SPRING_PROFILES_ACTIVE=native
    depends_on:
      - postgres
      - rabbitmq
      - mongodb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: ./discovery-server
    container_name: tr_discovery_server
    ports:
      - "8761:8761"
    networks:
      - tr-net
    depends_on:
      config-server:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    container_name: tr_gateway
    ports:
      - "8222:8222"
    networks:
      - tr-net
    depends_on:
      - discovery-server

  auth-service:
    build:
      context: ./auth-service
    container_name: tr_auth_service
    ports:
      - "8070:8070"
    networks:
      - tr-net
    depends_on:
      - discovery-server
      - postgres
      - rabbitmq

  customer-service:
    build:
      context: ./customer-service
    container_name: tr_customer_service
    ports:
      - "8090:8090"
    networks:
      - tr-net
    depends_on:
      - discovery-server
      - mongodb
      - rabbitmq

  booking-service:
    build:
      context: ./booking-service
    container_name: tr_booking_service
    ports:
      - "8060:8060"
    networks:
      - tr-net
    depends_on:
      discovery-server:
        condition: service_started
      mongodb:
        condition: service_started

  postgres:
    container_name: tr_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - tr-net
    restart: unless-stopped

  pgadmin:
    container_name: tr_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - tr-net
    restart: unless-stopped

  mongodb:
    container_name: tr_mongo_db
    image: mongo
    ports:
      - 27017:27017
    networks:
      - tr-net
    volumes:
      - mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password

  mongo-express:
    container_name: tr_mongo_express
    image: mongo-express
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: user
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb

  rabbitmq:
    image: rabbitmq:management
    container_name: tr_rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - tr-net
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


